[package]
name = "macmemana"
version = "0.2.1"
edition = "2024"
authors = ["Benign X <1341398182@qq.com>"]
description = "A terminal-based memory analysis tool for macOS with accurate swap accounting."
license = "MIT"
repository = "https://github.com/W-Mai/macmemana"
readme = "README.md"
keywords = ["memory", "macos", "swap", "monitor", "tui"]
categories = ["command-line-utilities", "system-tools"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.30"
rayon = "1.10"
bytesize = "1.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
libc = "0.2.180"
